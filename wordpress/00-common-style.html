<!-- 最初に1回だけ貼付。保存時にstyleが消える場合は00-common.cssを追加CSSへ。 -->
<style>
.clear-lp{--paper:#f7f5ef;--white:#fffefa;--green:#344b40;--sage:#e7ebe3;--ink:#292e2b;--orange:#e99432;--copper:#efb66b;--line:#c9cec2;--muted:#5d665e;--serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;--sans:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
.clear-lp, .clear-lp *{box-sizing:border-box}
.clear-lp{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.95;letter-spacing:.025em;-webkit-font-smoothing:antialiased}
.clear-lp a{color:inherit;text-underline-offset:5px}
.clear-lp a,.clear-lp summary{touch-action:manipulation}
.clear-lp img{display:block;width:100%;height:auto;object-fit:cover}
.clear-lp figure,.clear-lp p,.clear-lp h1,.clear-lp h2,.clear-lp h3,.clear-lp ul,.clear-lp blockquote{margin:0}
.clear-lp p+p{margin-top:1.25em}
.clear-lp h1,.clear-lp h2,.clear-lp h3{font-family:var(--serif);font-weight:600;font-feature-settings:"palt";letter-spacing:.045em}
.clear-lp h2{font-size:clamp(29px,3vw,40px);line-height:1.65;margin-bottom:30px}
.clear-lp h3{font-size:24px;line-height:1.7;margin-bottom:20px}
.clear-lp p{overflow-wrap:anywhere}
.clear-lp ul{padding:0;list-style:none}
.clear-lp em{font-style:normal}
.clear-lp button,.clear-lp a,.clear-lp summary{-webkit-tap-highlight-color:transparent}
.clear-lp a:focus-visible,.clear-lp summary:focus-visible{outline:3px solid var(--orange);outline-offset:6px}
.clear-lp .wrap{width:min(1160px,calc(100% - 112px));margin:auto}
.clear-lp .section{padding:112px 0}
.clear-lp .split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.clear-lp .section-label{display:flex;align-items:center;gap:16px;color:var(--green);font-family:Georgia,serif;font-size:16px;letter-spacing:.1em;margin-bottom:28px}
.clear-lp .section-label>span:first-child{font-size:21px;letter-spacing:0}
.clear-lp .section-label i{height:1px;width:58px;background:currentColor;opacity:.45}
.clear-lp .dark{background:var(--ink);color:var(--paper)}
.clear-lp .dark .section-label{color:var(--copper)}
.clear-lp .dark h2{color:var(--paper)}
.clear-lp .serif{font-family:var(--serif);font-weight:600}
.clear-lp .statement{font-size:24px;line-height:1.9}
.clear-lp .strong{font-weight:700;color:var(--green)}
.clear-lp .fineprint{font-size:16px}
.clear-lp .button{display:flex;gap:22px;align-items:center;justify-content:space-between;min-height:68px;padding:16px 25px;background:var(--orange);color:#fffefa;text-decoration:none;font-size:18px;font-weight:700;line-height:1.65;transition:background .2s,transform .2s}
.clear-lp .button>span:last-child{font-family:Arial,sans-serif;font-size:26px;font-weight:400;flex-shrink:0}
.clear-lp .button:hover{background:#dc8225;transform:translateY(-2px)}
.clear-lp .button-green{background:var(--green)}
.clear-lp .button-green:hover{background:#25392e}
.clear-lp .button-outline{border:1px solid var(--green);color:var(--green);background:transparent}
.clear-lp .button-outline:hover{background:var(--sage)}
.clear-lp .center-action{display:flex;justify-content:center;margin-top:52px}
.clear-lp .center-action .button{min-width:min(450px,100%)}
.clear-lp .skip-link{position:fixed;top:-100px;left:20px;z-index:100;background:white;padding:16px}
.clear-lp .skip-link:focus{top:20px}
.clear-lp .site-header{height:100px;padding:0 4.5%;display:flex;align-items:center;justify-content:space-between;gap:32px;background:var(--paper);border-bottom:1px solid #dee1d8}
.clear-lp .brand{text-decoration:none;display:flex;flex-direction:column;color:var(--green);line-height:1}
.clear-lp .brand>span{font-family:Georgia,serif;font-size:16px;letter-spacing:.06em}
.clear-lp .brand strong{font-family:Georgia,serif;font-size:55px;letter-spacing:-.05em;font-weight:400;line-height:.97}
.clear-lp .brand-dot{color:var(--orange)}
.clear-lp .desktop-nav{display:flex;gap:30px;margin-left:auto;font-size:16px;font-weight:600}
.clear-lp .desktop-nav a{text-decoration:none;padding:12px 0}
.clear-lp .desktop-nav a:hover{color:var(--orange)}
.clear-lp .header-book{padding:14px 22px;background:var(--green);color:white;font-size:16px;text-decoration:none}
.clear-lp .header-book span{margin-left:18px}
.clear-lp .hero{background:var(--green);color:var(--paper)}
.clear-lp .hero-main{display:grid;grid-template-columns:49% 51%;min-height:660px;background:var(--paper);color:var(--ink)}
.clear-lp .hero-copy{padding:44px 9% 48px 10%;display:flex;flex-direction:column;align-items:flex-start}
.clear-lp .hero-audience{font-size:17px;max-width:430px;line-height:1.8;color:var(--green);font-weight:600}
.clear-lp .hero-rule{width:54px;height:2px;background:var(--orange);margin:25px 0}
.clear-lp .hero h1{font-size:clamp(32px,3.35vw,49px);line-height:1.6;white-space:nowrap;margin-bottom:20px;letter-spacing:.03em}
.clear-lp .hero h1 em{color:var(--green)}
.clear-lp .hero-message{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.9;max-width:450px}
.clear-lp .hero-message wbr:after{content:""}
.clear-lp .hero-location{font-size:16px;line-height:1.9;margin-top:22px;color:var(--muted)}
.clear-lp .hero-location wbr{display:block}
.clear-lp .hero-copy .button{margin-top:24px;min-width:350px}
.clear-lp .hero-image{position:relative;overflow:hidden;border-bottom-left-radius:100px}
.clear-lp .hero-image>img{height:100%;position:absolute;inset:0;object-position:48% center}
.clear-lp .hero-image figcaption{position:absolute;right:28px;bottom:28px;width:130px;height:130px;background:var(--paper);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--green);outline:1px solid #f7f5ef99;outline-offset:7px}
.clear-lp .hero-image figcaption span{font:13px Georgia,serif}
.clear-lp .hero-image figcaption strong{font:48px Georgia,serif;letter-spacing:-.04em}
.clear-lp .hero-intro{display:grid;grid-template-columns:1fr 1.15fr;gap:80px;padding-top:60px;padding-bottom:60px}
.clear-lp .hero-intro h2{font-size:25px;margin:0;line-height:1.95}
.clear-lp .hero-intro p{font-size:18px;line-height:2}
.clear-lp .concerns{background:var(--paper)}
.clear-lp .section-aside h2{margin-bottom:40px}
.clear-lp .offset-photo{width:86%;position:relative;margin:0 0 20px}
.clear-lp .offset-photo:before{content:"";position:absolute;inset:24px -24px -24px 24px;background:var(--sage);z-index:0}
.clear-lp .offset-photo img{position:relative;aspect-ratio:1.18;object-position:center}
.clear-lp .photo-index{position:absolute;bottom:-56px;left:0;font:16px Georgia,serif;letter-spacing:.06em;color:var(--green)}
.clear-lp .concern-content{padding-top:28px}
.clear-lp .check-list li{position:relative;padding:20px 0 20px 36px;border-bottom:1px solid var(--line)}
.clear-lp .check-list li:before{content:"✓";position:absolute;left:0;top:20px;color:var(--green);font-size:22px}
.clear-lp .concern-content .statement{margin-top:35px;font-size:22px}
.clear-lp .approach{background:var(--sage)}
.clear-lp .approach-intro{align-items:center}
.clear-lp .approach h2{font-size:clamp(28px,2.6vw,36px)}
.clear-lp .arched-photo{padding-top:28px}
.clear-lp .arched-photo img{aspect-ratio:.93;border-radius:220px 220px 0 0;object-position:38% center}
.clear-lp .principles-heading{margin-top:84px;border-bottom:1px solid #a8b4a6;padding-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.clear-lp .principles-heading h3{margin:0}
.clear-lp .principles-heading>span{font:18px Georgia,serif;color:var(--green);white-space:nowrap}
.clear-lp .principles{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:35px}
.clear-lp .principles article+article{border-left:1px solid #c5cdbf;padding-left:32px}
.clear-lp .large-number{display:block;font:italic 52px Georgia,serif;color:#53684f;margin-bottom:18px}
.clear-lp .principles h3{font-size:23px}
.clear-lp .principles p{font-size:18px}
.clear-lp .profile{padding-bottom:96px}
.clear-lp .profile-top{grid-template-columns:.8fr 1.1fr;gap:100px;align-items:center}
.clear-lp .profile-photo{position:relative;padding-bottom:55px}
.clear-lp .profile-photo>img{aspect-ratio:.82;object-position:50% 20%}
.clear-lp .profile-photo .section-label{margin-bottom:30px}
.clear-lp .nameplate{position:absolute;right:-35px;bottom:20px;min-width:250px;background:var(--green);padding:20px 32px;border-left:2px solid var(--copper)}
.clear-lp .nameplate>span{display:block;font-size:16px}
.clear-lp .nameplate>strong{display:block;font-family:var(--serif);font-size:30px;letter-spacing:.14em;font-weight:500}
.clear-lp .profile-copy h2{font-size:clamp(27px,2.7vw,38px)}
.clear-lp .profile-copy p{line-height:2.1}
.clear-lp .signature{font:italic 29px Georgia,serif;color:var(--copper);margin-top:30px}
.clear-lp .credentials{margin-top:58px;padding-top:30px;border-top:1px solid #5f665b}
.clear-lp .credentials-date{font-size:16px;color:#e1d4c5}
.clear-lp .rating-row{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-bottom:1px solid #5f665b;padding-bottom:30px;gap:30px}
.clear-lp .rating-row>div{display:flex;align-items:center;justify-content:space-between;gap:20px}
.clear-lp .rating-row>div+div{padding-left:30px;border-left:1px solid #5f665b}
.clear-lp .rating-row strong{font:56px Georgia,serif;color:var(--copper);margin-right:14px}
.clear-lp .rating-row>div>div{white-space:nowrap}
.clear-lp .credential-list{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px 44px}
.clear-lp .credential-list li{font-size:17px;padding-left:19px;position:relative}
.clear-lp .credential-list li:before{content:"";width:5px;height:5px;background:var(--copper);position:absolute;left:0;top:14px}
.clear-lp .credential-list li:first-child{grid-column:1/-1}
.clear-lp .flow-heading{max-width:780px;margin-bottom:56px}
.clear-lp .flow-heading .statement{margin-bottom:24px}
.clear-lp .flow-heading h2{margin-bottom:20px}
.clear-lp .flow-step{display:grid;grid-template-columns:.85fr 1.15fr;gap:54px;border-top:1px solid var(--line);padding:42px 0;align-items:center}
.clear-lp .flow-step:last-child{border-bottom:1px solid var(--line)}
.clear-lp .step-photo{height:290px;overflow:hidden}
.clear-lp .step-photo img{height:100%;object-position:center}
.clear-lp .flow-step:first-child .step-photo img{object-position:center 26%}
.clear-lp .step-copy{position:relative;padding-left:65px}
.clear-lp .step-number{position:absolute;left:0;top:-7px;color:var(--green);font:40px Georgia,serif}
.clear-lp .step-copy h3{font-size:27px;margin-bottom:14px}
.clear-lp .salon{background:var(--sage)}
.clear-lp .salon .split{align-items:center}
.clear-lp .salon-exterior{position:relative}
.clear-lp .salon-exterior img{aspect-ratio:1.2;object-position:48%;border-top-left-radius:70px}
.clear-lp .salon-bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;margin-top:50px}
.clear-lp .salon-note{border:1px solid #b2bea9;padding:40px;align-self:center;position:relative}
.clear-lp .salon-note:before{content:"“";font:80px Georgia,serif;background:var(--sage);position:absolute;top:-40px;left:25px;padding:0 10px;color:var(--green)}
.clear-lp .salon-note p{font-size:23px;line-height:2}
.clear-lp .price-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:75px;align-items:center}
.clear-lp .price-intro>img{aspect-ratio:1.1;margin-top:30px}
.clear-lp .price-card{padding:44px;background:var(--paper);color:var(--ink);position:relative}
.clear-lp .price-card:before{content:"";position:absolute;inset:10px;border:1px solid #c7cbbd;pointer-events:none}
.clear-lp .price-title{font-size:24px;font-family:var(--serif);font-weight:600;text-align:center}
.clear-lp .price-title>span{white-space:nowrap}
.clear-lp .regular-price{font-size:19px;text-align:center;margin-top:26px}
.clear-lp .regular-price>span:first-child{text-decoration:line-through;text-decoration-thickness:1px}
.clear-lp .regular-price>span:last-child{display:block;font-size:28px;line-height:1.3;color:var(--orange)}
.clear-lp .first-price{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--orange);margin-top:8px}
.clear-lp .first-price strong{font:82px Georgia,serif;letter-spacing:-.02em}
.clear-lp .first-price>span{font-size:22px}
.clear-lp .price-includes{border-top:1px solid var(--line);padding:24px 0;margin-top:22px}
.clear-lp .price-includes p{margin:0;font-size:18px}
.clear-lp .repeat-price{border-top:1px solid var(--line);padding-top:20px}
.clear-lp .repeat-price p{font-size:17px}
.clear-lp .repeat-price wbr{display:block}
.clear-lp .reservation-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;margin-bottom:44px}
.clear-lp .reservation-header>img{height:200px;object-position:50% 40%}
.clear-lp .booking-options{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.clear-lp .booking-options article{border-top:1px solid var(--line);padding-top:26px;display:flex;flex-direction:column;align-items:flex-start}
.clear-lp .option-number{font:30px Georgia,serif;color:var(--green);margin-bottom:15px;display:block}
.clear-lp .booking-options article p{margin:0 0 24px}
.clear-lp .booking-options .button{width:100%;margin-top:auto}
.clear-lp .booking-options .phone-option{grid-column:1/-1;display:grid;grid-template-columns:1.1fr .9fr;gap:75px}
.clear-lp .phone-option>div:last-child{padding-top:18px}
.clear-lp .phone-number{display:block;text-align:center;font:28px Georgia,serif;text-decoration:none;margin-top:20px}
.clear-lp .faq{background:#eeeee7}
.clear-lp .faq-layout{display:grid;grid-template-columns:.65fr 1.35fr;gap:75px}
.clear-lp .faq-intro>img{margin-top:40px;aspect-ratio:1.2;object-position:center 25%}
.clear-lp .faq-intro{position:sticky;top:40px}
.clear-lp .faq-items details{border-top:1px solid #bac2b3}
.clear-lp .faq-items details:last-child{border-bottom:1px solid #bac2b3}
.clear-lp .faq-items summary{display:grid;grid-template-columns:30px 1fr 20px;gap:14px;align-items:start;padding:28px 0;cursor:pointer;list-style:none;font-size:20px;font-weight:600;line-height:1.8}
.clear-lp .faq-items summary::-webkit-details-marker{display:none}
.clear-lp .q-mark{font:24px Georgia,serif;color:var(--green);padding-top:3px}
.clear-lp .faq-toggle{position:relative;width:18px;height:18px;margin-top:8px}
.clear-lp .faq-toggle:before,.clear-lp .faq-toggle:after{content:"";position:absolute;background:var(--green);left:0;top:8px;width:18px;height:1px}
.clear-lp .faq-toggle:after{transform:rotate(90deg)}
.clear-lp details[open] .faq-toggle:after{transform:rotate(0)}
.clear-lp .faq-answer{padding:0 25px 28px 44px}
.clear-lp .faq-answer p{line-height:2}
.clear-lp .voices-header{display:grid;grid-template-columns:1.2fr .8fr;gap:70px;align-items:center}
.clear-lp .voices-header img{aspect-ratio:1.6;object-position:50% 40%}
.clear-lp .voices-header h2{font-size:34px}
.clear-lp .voice-list{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin:48px 0 30px}
.clear-lp .voice{padding:28px 0 0;border-top:1px solid var(--green);display:flex;flex-direction:column}
.clear-lp .quote-mark{font:64px Georgia,serif;color:var(--orange);height:48px;line-height:1}
.clear-lp .voice blockquote{flex:1}
.clear-lp .voice p{font-size:18px;line-height:2.05}
.clear-lp .voice figcaption{font-size:16px;margin-top:24px;color:var(--green);font-weight:700}
.clear-lp .safety{background:var(--sage)}
.clear-lp .safety h2{font-size:32px}
.clear-lp .safety .split{grid-template-columns:.8fr 1.2fr;gap:80px}
.clear-lp .safety img{aspect-ratio:1.5;max-width:360px;margin-top:35px}
.clear-lp .safety-list{margin:28px 0;border-top:1px solid #bbc6b3;border-bottom:1px solid #bbc6b3;padding:20px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.clear-lp .safety-list li{padding-left:16px;position:relative}
.clear-lp .safety-list li:before{content:"・";position:absolute;left:0}
.clear-lp .access .split{grid-template-columns:.85fr 1.15fr;gap:80px}
.clear-lp .salon-name{font-family:Georgia,serif;font-size:22px}
.clear-lp .salon-name strong{font-size:38px;font-weight:400}
.clear-lp .access p wbr{display:block}
.clear-lp .access dl{margin:30px 0 0}
.clear-lp .access dl>div{display:grid;grid-template-columns:95px 1fr;gap:20px;border-top:1px solid var(--line);padding:17px 0}
.clear-lp .access dt{font-weight:600}
.clear-lp .access dd{margin:0}
.clear-lp .access-visual img{aspect-ratio:1.5}
.clear-lp .access-visual p{margin:24px 0}
.clear-lp .message-layout{display:grid;grid-template-columns:1fr 1fr;gap:85px}
.clear-lp .message-aside h2{font-size:32px}
.clear-lp .message-aside figure{margin-top:45px}
.clear-lp .message-aside img{aspect-ratio:1.05;object-position:35% center}
.clear-lp .message-aside figcaption{font:italic 26px Georgia,serif;color:var(--copper);margin-top:23px}
.clear-lp .message-copy p{line-height:2.1}
.clear-lp .message-copy .button{margin-top:40px}
.clear-lp .site-footer{background:var(--paper);padding:48px 0}
.clear-lp .footer-inner{display:flex;gap:50px;align-items:center}
.clear-lp .footer-inner p{font-size:16px;margin:0}
.clear-lp .back-top{margin-left:auto;display:flex;align-items:center;justify-content:center;text-decoration:none;width:52px;height:52px;border:1px solid var(--green);flex-shrink:0;color:var(--green);font-size:24px}
.clear-lp .mobile-booking{display:none}
@media(min-width:1600px){
.clear-lp .hero-main{max-width:1600px;margin:auto}
.clear-lp .hero{background:var(--green)}
.clear-lp .hero-copy{padding-left:14%}
}
@media(max-width:1150px){
.clear-lp .wrap{width:calc(100% - 72px)}
.clear-lp .split,.clear-lp .hero-intro,.clear-lp .profile-top,.clear-lp .salon-bottom,.clear-lp .price-layout,.clear-lp .faq-layout,.clear-lp .safety .split,.clear-lp .access .split,.clear-lp .message-layout{gap:44px}
.clear-lp .desktop-nav{gap:18px}
.clear-lp .site-header{gap:20px}
.clear-lp .hero-copy{padding:35px 8% 40px}
.clear-lp .hero h1{font-size:36px}
.clear-lp .hero-copy .button{min-width:0;width:100%}
.clear-lp .hero-main{min-height:640px}
.clear-lp .hero-intro h2{font-size:23px}
.clear-lp .principles{gap:24px}
.clear-lp .principles article+article{padding-left:24px}
.clear-lp .rating-row>div{display:block}
.clear-lp .rating-row>div>div{margin-top:12px}
.clear-lp .nameplate{right:-15px}
.clear-lp .price-card{padding:34px}
.clear-lp .price-title{font-size:22px}
.clear-lp .first-price strong{font-size:70px}
.clear-lp .flow-step{gap:35px}
.clear-lp .step-copy{padding-left:52px}
.clear-lp .step-copy h3{font-size:24px}
.clear-lp .principles h3{font-size:21px}
.clear-lp .message-aside h2{font-size:28px}
.clear-lp .voices-header{gap:40px}
.clear-lp .voices-header h2{font-size:29px}
}
@media(max-width:850px){
.clear-lp .desktop-nav{display:none}
.clear-lp .wrap{width:calc(100% - 48px)}
.clear-lp .hero h1{font-size:30px}
.clear-lp .hero-message{font-size:18px}
.clear-lp .hero-audience{font-size:16px}
.clear-lp .hero-copy{padding:30px 7%}
.clear-lp .hero-image{border-bottom-left-radius:65px}
.clear-lp .hero-image figcaption{width:100px;height:100px}
.clear-lp .hero-image figcaption strong{font-size:40px}
.clear-lp .hero-image figcaption span{font-size:11px}
.clear-lp .hero-intro{gap:30px}
.clear-lp .hero-intro h2{font-size:22px}
.clear-lp .hero-intro p{font-size:18px}
.clear-lp .section{padding:80px 0}
.clear-lp .split,.clear-lp .profile-top,.clear-lp .price-layout,.clear-lp .faq-layout,.clear-lp .safety .split,.clear-lp .access .split,.clear-lp .message-layout{gap:32px}
.clear-lp .principles{grid-template-columns:1fr}
.clear-lp .principles article{display:grid;grid-template-columns:70px 1fr;column-gap:25px}
.clear-lp .principles article+article{border-left:0;border-top:1px solid #c5cdbf;padding:26px 0 0}
.clear-lp .principles h3{font-size:24px;align-self:center}
.clear-lp .principles p{grid-column:2}
.clear-lp .large-number{grid-column:1;grid-row:1/3;font-size:42px}
.clear-lp .profile-copy h2{font-size:27px}
.clear-lp .profile-top{align-items:start}
.clear-lp .nameplate{min-width:0;padding:18px 20px;right:-10px}
.clear-lp .nameplate>strong{font-size:26px}
.clear-lp .credential-list{grid-template-columns:1fr}
